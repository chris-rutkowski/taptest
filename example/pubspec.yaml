name: example
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  collection:
  decimal:
  dio:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod:
  flutter_svg:
  flutter_web_plugins:
    sdk: flutter
  go_router: ^18.0.0
  http:
  intl:
  json_annotation:
  material_ui: ^1.0.0
  riverpod_annotation:
  shared_preferences:

dev_dependencies:
  build_runner:
  custom_lint:
  flutter_gen_runner:
  flutter_test:
    sdk: flutter
  flutter_lints:
  json_serializable:
  riverpod_generator:
  riverpod_lint:
  taptest:
    path: ../taptest
  taptest_runtime:
    path: ../taptest_runtime

flutter:
  generate: true
  uses-material-design: true

  assets:
    - path: assets/images/

  fonts:
    - family: NotoSans
      fonts:
        - asset: assets/fonts/noto_sans.ttf

flutter_gen:
  integrations:
    flutter_svg: true
