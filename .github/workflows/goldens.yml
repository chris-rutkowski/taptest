name: Goldens

on:
  workflow_dispatch:

concurrency:
  group: goldens-${{ github.ref }}
  cancel-in-progress: true

jobs:
  goldens:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/adrianjagielak/flutter:3.47.0@sha256:19a67f5db67497cc5537060fde9ba0b4506b98e32dcaae0fd8891561ca88b6eb

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Get package dependencies
      run: flutter pub get
      working-directory: ./example

    - name: Verify goldens
      run: flutter test --reporter=failures-only
      working-directory: ./example

    - name: Regenerate failing goldens
      if: failure()
      run: flutter test --update-goldens --reporter=failures-only
      working-directory: ./example

    - name: Upload updated goldens
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: updated-goldens
        path: |
          example/test/**/goldens/**
        retention-days: 1
